# Dependabot version updates for BearMail's own pieces.
#
# The mail engine under crates/ is the frozen Stalwart 0.16.16 tree. Do not
# add a cargo entry for "/". A rocksdb, mail-auth, or mail-parser bump can
# fail to compile or change stored mail, and the installer ships the
# committed stalwart binary rather than a rebuild of that tree.
#
# edge/ pins proxy-header to exactly 0.1.2, so it has no range to bump.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      mcp:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      webui:
        patterns:
          - "*"
