body:
  - type: markdown
    attributes:
      value: |
        This discussion is for BearMail. For a bug or a feature request, open a GitHub issue on this repository. For an exploitable vulnerability, open a private security advisory instead of a public post.
  - type: textarea
    attributes:
      label: Topic
      description: Describe the question or topic.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Acknowledgement
      options:
        - label: I checked the BearMail docs and existing issues before posting.
          required: true
