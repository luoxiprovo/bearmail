# BearMail ships Linux x86-64 only (see docs/LIMITATIONS.md).
# Upstream Stalwart's tag-triggered matrix (ARM, musl, macOS, Windows,
# FreeBSD, Docker Hub) is disabled so a v* tag does not start those jobs.

name: CI

on:
  workflow_dispatch:

jobs:
  linux-only:
    name: Linux x86-64 only
    runs-on: ubuntu-latest
    steps:
      - name: No multi-arch release
        run: |
          echo "BearMail does not build ARM, macOS, Windows, FreeBSD, or Docker images."
          echo "Release artifacts are the Linux x86-64 binary and WebUI archive on GitHub Releases."
