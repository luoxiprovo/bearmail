name: Question
description: Ask about BearMail setup, configuration, or expected behavior.
title: "Question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      description: Docs, commands, or settings you already checked.
  - type: input
    id: version
    attributes:
      label: BearMail version
      description: Release tag, commit, or the date you installed.
      placeholder: v0.1.0
