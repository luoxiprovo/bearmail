name: Feature request
description: Suggest a change to BearMail.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should BearMail do instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer or DNS
        - Mail
        - WebUI
        - MCP sidecar
        - Docs
        - Other
    validations:
      required: true
