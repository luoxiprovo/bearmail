  <text x="250" y="250" fill="#267a72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Waiting for human send</text>
  <rect x="236" y="268" width="186" height="72" rx="8" fill="#fffdf8"/>
  <text x="250" y="292" fill="#172a38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Jordan Lee</text>
  <text x="250" y="312" fill="#172a38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Invoice Q3</text>
  <text x="250" y="330" fill="#728089" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Attached the PDF&</text>

  <text x="470" y="56" fill="#172a38" font-family="Georgia, Cambria, serif" font-size="32" font-weight="500">Thursday kickoff notes</text>
