  <text x="250" y="152" fill="#172a38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Thursday kickoff notes</text>
  <text x="250" y="170" fill="#728089" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Can we move this to 4pm&</text>
  <rect x="236" y="188" width="186" height="72" rx="8" fill="#fffdf8"/>
  <text x="250" y="212" fill="#172a38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">scheduler@</text>
