  <text x="520" y="104" fill="#172a38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Ada Chen</text>
  <text x="520" y="122" fill="#728089" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">ada@example.com · Today 9:14</text>
  <text x="470" y="180" fill="#41535e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Can we move this to 4pm Mountain? The gym</text>
  <text x="470" y="204" fill="#41535e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">just opened an extra court.</text>
  <rect x="470" y="236" width="520" height="92" rx="13" fill="#dceeea" stroke="#bcd8d3"/>
  <rect x="488" y="256" width="47" height="47" rx="12" fill="#267a72"/>
