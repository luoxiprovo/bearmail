  <rect x="670" y="360" width="88" height="34" rx="8" fill="#fffdf8" stroke="#9fc6c0"/>
  <text x="692" y="382" fill="#172a38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750">Decline</text>
