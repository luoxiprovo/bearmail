  <text x="40" y="257" fill="#aebdc1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Sent</text>
  <text x="40" y="301" fill="#aebdc1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Calendar</text>
  <text x="32" y="668" fill="#d9e1e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">you@example.com</text>
  <text x="32" y="686" fill="#849a9f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Human mailbox</text>

  <rect x="224" y="0" width="210" height="720" fill="#f3f1eb" stroke="#dfe3e2"/>
